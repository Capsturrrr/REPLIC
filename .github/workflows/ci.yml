name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install numpy
      - name: Build with warnings as errors
        run: make clean && make CFLAGS="-Wall -Wextra -Werror -g -std=c11" all chat
      - name: Unit, end-to-end and simulator tests
        run: make test
      - name: Parser fuzzing with ASan + UBSan
        run: make fuzz
      - name: Reproduce headline result (virtual time)
        run: NOTEST=1 SEEDS=30 ./repro.sh
